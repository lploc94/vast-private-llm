[project]
name = "vast-private-llm"
version = "0.1.0"
description = "Private Vast.ai LLM dashboard and local OpenAI-compatible API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "uvicorn>=0.30",
    "vastai>=1.8.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
